name: Brick
options:
  minimumXcodeGenVersion: 2.38.0
  bundleIdPrefix: com.nulljosh
settings:
  base:
    # Must live under settings.base -- xcodegen silently drops DEVELOPMENT_TEAM
    # if you put it on a target.
    DEVELOPMENT_TEAM: QMM486NPYC
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Brick-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ios/Sources
      - path: ios/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.brick
        PRODUCT_NAME: Brick
        # ponytail: iPhone only for 1.0. iPad needs its own layout and screenshots.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Brick
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
